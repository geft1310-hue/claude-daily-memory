name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install complete application and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[google,gemini,notebooklm]' build
      - name: Verify dependencies
        run: python -m pip check
      - name: Verify installer contract
        run: python -m unittest discover -s tests -p 'test_installer.py'
      - name: Verify release safety
        run: python -m unittest discover -s tests -p 'test_release_safety.py'
      - name: Run complete synthetic suite
        run: python -m unittest discover -s tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in clean venv
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install --upgrade pip
          wheel-venv/bin/python -m pip install "${wheel}[google,gemini,notebooklm]"
          wheel-venv/bin/python -m pip check
          wheel-venv/bin/claude-daily-memory --help
          wheel-venv/bin/claude-daily-memory-setup --help
          wheel-venv/bin/notebooklm --help
          wheel-venv/bin/notebooklm-mcp --help
      - name: Validate shell and repository diff
        run: |
          bash -n install.sh
          git diff --check
